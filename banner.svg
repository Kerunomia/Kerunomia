<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="keru">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .win { fill: none; stroke: #30363d; stroke-width: 1; }
      .winf { fill: #161b22; stroke: #30363d; stroke-width: 1; opacity: 0.55; }
      .bar { stroke: #21262d; stroke-width: 1; }
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .name { fill: #c9d1d9; font-size: 64px; letter-spacing: 6px; }
      .sub { fill: #6e7681; font-size: 16px; letter-spacing: 3px; }
      .dim { fill: #484f58; font-size: 12px; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- faint window outlines, like a compositor looking at itself -->
  <g>
    <rect class="winf" x="40"  y="40"  width="160" height="110" rx="4"/>
    <rect class="win"  x="150" y="70"  width="200" height="130" rx="4"/>
    <rect class="winf" x="390" y="30"  width="150" height="100" rx="4"/>
    <rect class="win"  x="560" y="60"  width="230" height="140" rx="4"/>
    <rect class="winf" x="720" y="20"  width="140" height="90"  rx="4"/>
    <line class="bar" x1="40" y1="150" x2="860" y2="150"/>
    <line class="bar" x1="60" y1="176" x2="840" y2="176"/>
  </g>

  <ellipse cx="450" cy="110" rx="300" ry="120" fill="url(#glow)"/>

  <text class="t name" x="450" y="112" text-anchor="middle">keru</text>
  <text class="t sub"  x="450" y="146" text-anchor="middle">LOW-LEVEL LINUX GRAPHICS, MOSTLY AT NIGHT</text>
  <text class="t dim"  x="450" y="200" text-anchor="middle">windows in, windows out</text>
</svg>
